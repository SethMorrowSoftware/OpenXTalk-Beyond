name: Build problem
description: Building OXT-Beyond from source fails.
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Before you file this, please read the troubleshooting section of
        [BUILDING.md](https://github.com/SethMorrowSoftware/OpenXTalk-Beyond/blob/main/BUILDING.md#8-troubleshooting).
        Many Windows build failures come from a missing Visual Studio
        component, Python 3 being used instead of Python 2.7 for the build
        (packaging needs Python 3), or the wrong `bash` (Git's or WSL's
        instead of Cygwin's). Linux and macOS builds follow the steps of
        their CI workflows; see
        [Building on Linux](https://github.com/SethMorrowSoftware/OpenXTalk-Beyond/blob/main/BUILDING.md#12-building-on-linux)
        and
        [Building on macOS](https://github.com/SethMorrowSoftware/OpenXTalk-Beyond/blob/main/BUILDING.md#13-building-on-macos).

  - type: dropdown
    id: platform
    attributes:
      label: Which platform are you building for?
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Linux x86-64
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does the build run?
      options:
        - On my own computer
        - GitHub Actions in my fork
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`, and the branch if it is not `main`.
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: Which step fails?
      options:
        - Installing the tools
        - Cloning the repository
        - Configuring (config.py, configure.bat, make config-linux-* or config.sh)
        - Building or fetching the prebuilt libraries
        - Building (make.cmd or msbuild, make, or xcodebuild)
        - Running the built IDE
        - Fetching the external assets (oxt-runtimes, tools/oxt/fetch_assets.py)
        - Packaging (tools/ci/package-windows.ps1, tools/oxt/package.py or package_dist.py)
        - Joining or signing the macOS app (tools/ci/merge_universal.py, sign_mac_app.py)
        - Smoke test (tools/ci/smoke-test.ps1 or run_livecode_check.py smoke)
        - IDE compile check (tools/ci/ide-compile-check.ps1 or run_livecode_check.py compile)
        - Testing the Linux package (check_linux_libraries.py, test_linux_package.py)
        - Building the Windows installer (tools/ci/build-installer.ps1)
        - Testing the Windows installer (tools/ci/test-installer.ps1)
        - Something else
    validations:
      required: true

  - type: textarea
    id: tools
    attributes:
      label: Tool versions
      description: |
        Please give, on Windows:
        - Windows version (`winver`);
        - Visual Studio edition and version, and whether the v141 components are installed
          (`powershell -ExecutionPolicy Bypass -File tools\ci\install-vs-components.ps1 -VerifyOnly`);
        - Windows SDK version, if you set `WINSDK_VERSION`;
        - `C:\Python27\python.exe --version`;
        - for packaging, `py -3 --version` (or `python3 --version`);
        - for the installer, the Inno Setup version (the first line of `ISCC.exe` output, or *Help > About* in the Inno Setup IDE);
        - `perl -e "print $^V, ' ', $^O"`;
        - `git --version`;
        - `C:\cygwin64\bin\bison.exe --version` and `C:\cygwin64\bin\flex.exe --version` (first lines);
        - any of `BUILDTYPE`, `VSINSTALLDIR`, `WINSDK_VERSION`, `MSBUILD_EXTRA_ARGS`, `CYGPATH`, `PREBUILT_*`, `OXT_ASSETS_CACHE` or `OXT_BUILD_NUMBER` that you set.

        On Linux: the distribution and version (`/etc/os-release`), `gcc --version`, `python --version`
        (Python 2.7), `python3 --version`, `ldd --version` (first line), and the `PREBUILT_*`,
        `MODE`, `BUILDTYPE` or `OXT_*` variables you set.

        On macOS: `sw_vers`, `uname -m`, `xcodebuild -version`, `python --version` (Python 2.7),
        `python3 --version`, and the `PREBUILT_*`, `TARGET_ARCH`, `XCODE_*` or `OXT_*` variables you set.
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands you ran
      description: The commands, in order, and the folder you ran them in.
      render: text
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Error output
      description: >
        For Windows build failures, search `build-win-x86_64\msbuild.log` for
        the first line containing `error` and paste about 30 lines before and
        after it; for Linux (make) and macOS (xcodebuild) builds, the first
        error in the build output and the lines around it. For other steps,
        paste the console output.
      render: text
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: >
        What you have already tried. You can attach the whole `msbuild.log`
        or build log here (zip it first).
