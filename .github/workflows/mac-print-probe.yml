# For a probe only, and removed before its pull request merges: printing to
# PDF and exported snapshots on the Mac, with the published 0.2.7-rc.6.9
# (richmond62 on rc.6.4, macOS 12 Intel: a PDF that came out
# white, and a snapshot of white text on black that was not the inversion of
# the black on white one). tools/ci/mac-print-probe.livecodescript makes the
# files, headless and in the IDE; this prints what they hold, and each as an
# image for tools/ci/print_images.py. The jobs pass whatever the files hold.
name: Print probe (macOS)

on:
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/mac-print-probe.yml
      - tools/ci/mac-print-probe.livecodescript
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-print-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.tag }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15, macos-15-intel ]
        tag: [ v0.2.7-rc.6.9 ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: |
          sw_vers
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/oxt-test"
          gh release download "$TAG" --repo "$REPO" --pattern "*-mac-universal.zip" --dir "$RUNNER_TEMP/dist"
          ditto -x -k "$RUNNER_TEMP"/dist/*-mac-universal.zip "$RUNNER_TEMP/oxt-test"
          ls "$RUNNER_TEMP/oxt-test"

      - name: Headless (the engine with -ui)
        run: |
          app=$(ls -d "$RUNNER_TEMP"/oxt-test/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/headless"
          set +e
          OXT_PROBE_HEADLESS=1 OXT_PROBE_OUT="$RUNNER_TEMP/headless" \
            "$app/Contents/MacOS/OXT-Beyond" -ui "$PWD/tools/ci/mac-print-probe.livecodescript"
          echo "exit status $?"
          ls -la "$RUNNER_TEMP/headless"

      - name: In the IDE
        run: |
          set +e
          python3 tools/ci/ui_tour.py --install "$RUNNER_TEMP/oxt-test" --platform mac-universal \
            --script tools/ci/mac-print-probe.livecodescript --timeout 300 --out "$RUNNER_TEMP/ide" | grep -v '^IMAGE '
          echo "exit status ${PIPESTATUS[0]}"
          ls -la "$RUNNER_TEMP/ide/shots"

      # Each PDF's objects and the operators of its pages' content, and every
      # file as a PNG (sips draws the PDF's first page and converts the GIF
      # and JPEG snapshots)
      - name: What the files hold
        env:
          TAG: ${{ matrix.tag }}
        run: |
          for d in "$RUNNER_TEMP/headless" "$RUNNER_TEMP/ide/shots"; do
            [ -f "$d/card.pdf" ] && sips -s format png "$d/card.pdf" --out "$d/card-pdf.png" >/dev/null
            for f in "$d"/*.gif "$d"/*.jpeg; do
              [ -f "$f" ] && sips -s format png "$f" --out "$f.png" >/dev/null
            done
          done
          python3 - "$RUNNER_TEMP" "$TAG" <<'PY'
          import base64, os, re, sys, zlib
          root, tag = sys.argv[1], sys.argv[2]
          def image(name, path):
              data = base64.b64encode(open(path, 'rb').read()).decode('ascii')
              parts = [data[i:i + 4000] for i in range(0, len(data), 4000)] or ['']
              for i, part in enumerate(parts):
                  print('IMAGE %s %d/%d %s' % (name, i + 1, len(parts), part))
          for run, d in (('headless', os.path.join(root, 'headless')), ('ide', os.path.join(root, 'ide', 'shots'))):
              pdf = os.path.join(d, 'card.pdf')
              if os.path.isfile(pdf):
                  raw = open(pdf, 'rb').read()
                  ops = {}
                  for m in re.finditer(rb'stream\r?\n(.*?)\r?\nendstream', raw, re.S):
                      body = m.group(1)
                      try:
                          body = zlib.decompress(body)
                      except Exception:
                          pass
                      for op in re.findall(rb'(?<![A-Za-z])(Tj|TJ|Tf|re|f\*?|Do|cm|BT|ET|rg|RG)(?![A-Za-z])', body):
                          ops[op.decode()] = ops.get(op.decode(), 0) + 1
                  keys = [k.decode() for k in sorted(set(re.findall(rb'/(Font|FontFile\d?|Image|XObject|Pattern|Shading|Page)\b', raw)))]
                  print('%s %s: card.pdf %d bytes, objects %s, operators %s' % (tag, run, len(raw), keys, ops))
              else:
                  print('%s %s: no card.pdf' % (tag, run))
              if os.path.isdir(d):
                  for n in sorted(os.listdir(d)):
                      if n.endswith('.png'):
                          image('%s-%s/%s' % (tag, run, n), os.path.join(d, n))
          PY
