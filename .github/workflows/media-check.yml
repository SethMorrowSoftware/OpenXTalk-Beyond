# The browser widget, revBrowser and the player in the packages of a
# published release, on each platform's runner: tools/ci/media_check.py
# with the Windows portable zip, the Linux tar.xz and the macOS zip as
# users download them (on macOS on both architectures). The build
# workflows run the same check on the packages they make; this one checks
# what is already out, without a build, by hand for any release. (It runs
# on no pull request: a release's known faults would make every one red.)

name: Browser and player check (release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to check (for example v0.2.1-rc.3); empty for the latest one
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: media-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.platform }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x86_64
            runner: windows-2022
            asset: win-x86_64-portable.zip
          - platform: linux-x86_64
            runner: ubuntu-24.04
            asset: linux-x86_64.tar.xz
          - platform: mac-universal
            runner: macos-15
            asset: mac-universal.zip
          - platform: mac-universal
            runner: macos-15-intel
            asset: mac-universal.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [ -z "$TAG" ]; then
            # the newest release whose tag is a version (not runtimes-* or prebuilts-*)
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          mkdir -p "$RUNNER_TEMP/dist"
          gh release download "$TAG" --repo "$REPO" --pattern "*-$ASSET" --dir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          # (pwd -W: the Windows path, for Python, in Git Bash)
          echo "PACKAGE=$(pwd -W 2>/dev/null || pwd)/$(ls *-"$ASSET")" >> "$GITHUB_ENV"

      # mplayer for the player (the engine runs /usr/bin/mplayer), Xvfb for
      # a screen, and the libraries of the launcher's list
      - name: Install mplayer, Xvfb and the runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          pkgs=(mplayer xvfb xauth)
          while read -r soname use deb rpm rest; do
            case $soname in ''|'#'*) continue ;; esac
            if apt-cache show --no-all-versions "${deb}t64" > /dev/null 2>&1; then
              deb="${deb}t64"
            fi
            case " ${pkgs[*]} " in *" $deb "*) ;; *) pkgs+=("$deb") ;; esac
          done < Installer/linux/libraries.txt
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"

      # The macOS zip holds OXT-Beyond.app, which ditto extracts as Finder
      # does; the others are extracted by the check itself
      - name: Extract the app
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/oxt-test"
          ditto -x -k "$PACKAGE" "$RUNNER_TEMP/oxt-test"
          echo "LAYOUT=--install=$RUNNER_TEMP/oxt-test" >> "$GITHUB_ENV"

      - name: Browser and player check
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          py=python3
          [ "$RUNNER_OS" = Windows ] && py=python
          "$py" tools/ci/media_check.py ${LAYOUT:---package=$PACKAGE} --platform "$PLATFORM" \
            --log "$RUNNER_TEMP/media-check.log"

      # The IDE as a user starts it: the app's own engine with its home
      # stack, splash, menus and palettes and a user interface, which no
      # other check does on macOS (they run -ui or a test stack of their
      # own). It must still be running after two minutes; a screenshot,
      # its output and any crash report macOS wrote are uploaded.
      - name: Start the IDE
        if: always() && runner.os == 'macOS'
        run: |
          APP="$RUNNER_TEMP/oxt-test/OXT-Beyond.app"
          OUT="$RUNNER_TEMP/ide-start"
          mkdir -p "$OUT"
          echo "Machine: $(uname -m), macOS $(sw_vers -productVersion), $(sysctl -n machdep.cpu.brand_string 2>/dev/null)"
          sysctl -n machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null || true
          ls ~/Library/Logs/DiagnosticReports > "$OUT/reports-before.txt" 2>/dev/null || true
          "$APP/Contents/MacOS/OXT-Beyond" > "$OUT/ide-output.txt" 2>&1 &
          pid=$!
          status=running
          for i in $(seq 1 120); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; status="ended with exit status $? after $i s"; break
            fi
            [ "$i" = 30 ] && screencapture -x "$OUT/ide-30s.png" || true
            sleep 1
          done
          screencapture -x "$OUT/ide-end.png" || true
          echo "IDE: $status"
          kill "$pid" 2>/dev/null || true
          sleep 3
          for d in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            find "$d" -maxdepth 1 \( -name 'OXT-Beyond*' -o -name 'LiveCode*' \) -exec cp {} "$OUT/" \; 2>/dev/null || true
          done
          ls -l "$OUT"
          echo "--- output"; head -c 20000 "$OUT/ide-output.txt" || true
          for f in "$OUT"/*.ips "$OUT"/*.crash; do
            [ -f "$f" ] || continue
            echo "--- $f"; head -c 30000 "$f"
          done
          [ "$status" = running ]

      - name: Upload the IDE start
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ide-start-${{ matrix.runner }}
          path: ${{ runner.temp }}/ide-start
          if-no-files-found: ignore
