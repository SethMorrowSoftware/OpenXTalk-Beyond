# The dark switch check (tools/ci/dark_switch_check.py: a standard button,
# an option menu and a combo box are drawn for the appearance Windows has,
# when the engine starts in it and when Windows is switched to it while the
# engine runs) with the Windows portable zip of a published release, on
# Windows Server 2022 (Windows 10's code base) and 2025 (Windows 11's), with
# visual styles on. The Windows build runs the same check on the package it
# makes; this one shows what a release does, without a build: by hand, and
# on a pull request that changes the check itself, where the release's
# result is reported (in the step's log and the job's summary) without
# failing the pull request's check (a release's known fault would keep it
# red), so that the check is seen to catch the fault it was written for.
# Run by hand, a release that fails the check fails the job.

name: Dark switch check (release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to check (for example v0.2.7); empty for the latest one
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dark-switch-check.yml'
      - 'tools/ci/dark_switch_check.py'
      - 'tools/ci/dark-switch-check.livecodescript'

permissions:
  contents: read

concurrency:
  group: dark-switch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            # the newest release whose tag is a version (not runtimes-* or prebuilts-*)
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          mkdir -p "$RUNNER_TEMP/dist"
          gh release download "$TAG" --repo "$REPO" --pattern "*-win-x86_64-portable.zip" --dir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          # (pwd -W: the Windows path, for Python, in Git Bash)
          echo "PACKAGE=$(pwd -W)/$(ls *-win-x86_64-portable.zip)" >> "$GITHUB_ENV"

      # Windows Server leaves the Themes service off, and without visual
      # styles the engine draws the controls itself: start it, so that the
      # Windows theme's buttons are checked, as people have them (the check
      # fails when they are still off)
      - name: Turn on visual styles
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Service -Name Themes -StartupType Automatic
          Start-Service -Name Themes
          Get-Service -Name Themes

      - name: Dark switch check
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python tools/ci/dark_switch_check.py --package "$PACKAGE" --platform win-x86_64 --need-visual-styles --need-screen --log "$RUNNER_TEMP/dark-switch-check.log"
