# TEMPORARY diagnostic (removed before the PR): opens both dictionaries in
# the real IDE of the published 0.2.3 Mac app and logs what happens.
name: Dictionary probe
on:
  push:
    branches: [claude/mac-dictionaries-pbbgsg]
    paths: ['.github/workflows/dict-probe.yml', 'tools/ci/dict-probe/**']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install 0.2.3
        run: |
          echo "Machine: $(uname -m), macOS $(sw_vers -productVersion)"
          curl -sSL -o oxt.dmg https://github.com/SethMorrowSoftware/OpenXTalk-Beyond/releases/download/v0.2.3/OXT-Beyond-0.2.3-mac-universal.dmg
          mkdir -p mnt
          for i in 1 2 3 4; do hdiutil attach -nobrowse -readonly -noautoopen -mountpoint mnt oxt.dmg && break; sleep $((10*i)); done
          ditto mnt/OXT-Beyond.app /Applications/OXT-Beyond.app
          hdiutil detach mnt || hdiutil detach -force mnt
      - name: Probe
        run: |
          APP=/Applications/OXT-Beyond.app
          OUT=$RUNNER_TEMP/probe; mkdir -p $OUT
          PROBE_SRC=$PWD/tools/ci/dict-probe/probe_script.txt PROBE_DST=$OUT/DictProbe.livecode \
            "$APP/Contents/MacOS/OXT-Beyond" -ui $PWD/tools/ci/dict-probe/mkprobe.livecodescript
          run() {
            name=$1
            echo "=================== run $name"
            rm -rf ~/Library/Preferences/OXT-Beyond
            OXT_PROBE_OUT=$OUT/$name.log "$APP/Contents/MacOS/OXT-Beyond" $OUT/DictProbe.livecode > $OUT/$name-ide.txt 2>&1 &
            pid=$!
            for i in $(seq 1 90); do
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            kill $pid 2>/dev/null || true; sleep 2; kill -9 $pid 2>/dev/null || true
            cat $OUT/$name.log || true
            head -c 4000 $OUT/$name-ide.txt || true
            for f in $OUT/$name.log-text.png $OUT/$name.log-quick.png; do
              [ -f "$f" ] || continue
              sips -s format jpeg -s formatOptions 50 "$f" --out "$f.jpg" >/dev/null
              python3 -c "import base64,sys; d=base64.b64encode(open(sys.argv[1],'rb').read()).decode(); n=(len(d)+59999)//60000; [print('IMAGE %s %d/%d %s'%(sys.argv[2],i+1,n,d[i*60000:(i+1)*60000])) for i in range(n)]" "$f.jpg" "$(basename $f).jpg"
            done
          }
          run light
          defaults write -g AppleInterfaceStyle Dark
          run darkmac
          OXT_PROBE_DARK=1 run darkide
          defaults delete -g AppleInterfaceStyle || true
          chmod -R a-w "$APP/Contents/Tools/Documentation" "$APP/Contents/Tools/Plugins"
          run readonly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dict-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/probe
