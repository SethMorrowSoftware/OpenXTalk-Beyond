# TEMPORARY, removed before this branch's pull request is ready. On
# 11 November 2026 the hosted Linux runners stopped resolving Ubuntu's
# package servers. The first run of this probe measured why (their name
# servers time out on Canonical's zones; 1.1.1.1 and 9.9.9.9 answer; the
# package servers answer). This one runs tools/ci/apt-name-servers.sh on
# the runners, as the workflows' steps now do, and times apt-get after it.
# No step fails the job: every line is a measurement.

name: Package server probe (temporary)

on:
  push:
    branches: [claude/apt-name-servers]

permissions:
  contents: read

jobs:
  host:
    name: Host ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - name: Before
        run: |
          set +e
          ls -l /etc/resolv.conf; cat /etc/resolv.conf
          grep -E '^hosts' /etc/nsswitch.conf
          cat /etc/apt/apt-mirrors.txt 2>/dev/null
          exit 0
      - name: The script, then apt-get
        run: |
          set +e
          s=$(date +%s.%N)
          bash tools/ci/apt-name-servers.sh
          echo "the script took $(echo "$(date +%s.%N) - $s" | bc) s"
          echo "== resolv.conf now"; cat /etc/resolv.conf
          for h in azure.archive.ubuntu.com ports.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
            s=$(date +%s.%N)
            a=$(getent ahostsv4 "$h" 2>/dev/null | awk '{print $1}' | sort -u | head -3 | tr '\n' ' ')
            echo "$h -> ${a:-NOT RESOLVED} in $(echo "$(date +%s.%N) - $s" | bc) s"
          done
          echo "== apt-get update"
          time sudo apt-get -o Acquire::Retries=3 update 2>&1 | tail -8
          echo "== apt-get install hello"
          time sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends hello 2>&1 | tail -6
          hello
          echo "== a second call changes nothing"
          s=$(date +%s.%N)
          bash tools/ci/apt-name-servers.sh
          echo "the script took $(echo "$(date +%s.%N) - $s" | bc) s"
          grep -c '^nameserver' /etc/resolv.conf
          exit 0
      - name: A minute later
        run: |
          set +e
          sleep 60
          cat /etc/resolv.conf
          time getent hosts azure.archive.ubuntu.com ports.ubuntu.com
          exit 0
