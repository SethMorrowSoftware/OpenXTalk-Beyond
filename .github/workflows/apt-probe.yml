# TEMPORARY, removed before this branch's pull request is ready. On
# 11 November 2026, from about 14:00 to 16:50 UTC, the hosted Linux runners
# could not resolve Ubuntu's package servers. The first run of this probe
# measured why (their name servers timed out on Canonical's zones; 1.1.1.1
# and 9.9.9.9 answered; the package servers answered). By the second run
# the names resolved again, so this one takes the name server away itself:
# on a runner, every query of systemd-resolved to its own servers is
# dropped; in a container, the name server is an address nothing answers
# at. Then tools/ci/apt-name-servers.sh (on the runner) and the
# workflows' own retry loop (in the container) run as the builds run
# them, and apt-get after them. No step fails the job: every line is a
# measurement.

name: Package server probe (temporary)

on:
  push:
    branches: [claude/apt-name-servers]

permissions:
  contents: read

jobs:
  host:
    name: Host ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - name: Take the runner's name servers away
        run: |
          set +e
          resolvectl dns
          grep -E '^hosts' /etc/nsswitch.conf
          for ip in $(resolvectl dns | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | sort -u); do
            echo "dropping queries to $ip"
            sudo iptables -I OUTPUT -d "$ip" -p udp --dport 53 -j DROP
            sudo iptables -I OUTPUT -d "$ip" -p tcp --dport 53 -j DROP
          done
          sudo resolvectl flush-caches
          for h in azure.archive.ubuntu.com ports.ubuntu.com github.com; do
            s=$(date +%s.%N)
            a=$(getent ahostsv4 "$h" 2>/dev/null | awk '{print $1}' | sort -u | head -3 | tr '\n' ' ')
            echo "$h -> ${a:-NOT RESOLVED} in $(echo "$(date +%s.%N) - $s" | bc) s"
          done
          exit 0
      - name: The script, then the package steps
        run: |
          set +e
          s=$(date +%s.%N)
          bash tools/ci/apt-name-servers.sh
          echo "the script took $(echo "$(date +%s.%N) - $s" | bc) s"
          echo "== resolv.conf now"; grep -Ev '^(#|$)' /etc/resolv.conf
          for h in azure.archive.ubuntu.com ports.ubuntu.com archive.ubuntu.com security.ubuntu.com github.com; do
            s=$(date +%s.%N)
            a=$(getent ahostsv4 "$h" 2>/dev/null | awk '{print $1}' | sort -u | head -3 | tr '\n' ' ')
            echo "$h -> ${a:-NOT RESOLVED} in $(echo "$(date +%s.%N) - $s" | bc) s"
          done
          echo "== update"
          time sudo apt-get -o Acquire::Retries=3 update 2>&1 | tail -6
          echo "== install hello"
          time sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends hello 2>&1 | grep -E '^(Get|Err|E:|W:|Setting up)'
          hello
          echo "== a second call"
          s=$(date +%s.%N)
          bash tools/ci/apt-name-servers.sh
          echo "the script took $(echo "$(date +%s.%N) - $s" | bc) s"
          grep -c '^nameserver' /etc/resolv.conf
          exit 0
      - name: Playwright's own package step, the same way
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set +e
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/python" -m pip install --quiet "playwright==1.56.0"
          bash tools/ci/apt-name-servers.sh
          time "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps chromium 2>&1 | tail -5
          exit 0
      - name: Give the name servers back
        if: always()
        run: |
          sudo iptables -F OUTPUT || true
          grep -Ev '^(#|$)' /etc/resolv.conf

  container:
    name: Loop in ${{ matrix.image }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['ubuntu:22.04', 'ubuntu:20.04']
    steps:
      - uses: actions/checkout@v7
      - name: The retry loop of web.yml, in a container whose name server does not answer
        env:
          IMAGE: mirror.gcr.io/library/${{ matrix.image }}
        run: |
          set +e
          python3 - > "$RUNNER_TEMP/loop.sh" <<'EOF'
          import re
          text = open('.github/workflows/web.yml', encoding='utf-8').read()
          m = re.search(r'^( +)for pass in 1 2 3; do\n.*?^\1done\n', text, re.M | re.S)
          print('\n'.join(line[len(m.group(1)):] for line in m.group(0).splitlines()))
          EOF
          wc -l "$RUNNER_TEMP/loop.sh"
          docker run --rm --dns 10.255.255.1 -e BUILD_PKGS=hello -e CACHE_HIT= -e DEBIAN_FRONTEND=noninteractive \
            -v "$RUNNER_TEMP/loop.sh:/loop.sh:ro" "$IMAGE" bash -c '
              echo "== resolv.conf at the start"; grep -Ev "^(#|$)" /etc/resolv.conf
              s=$(date +%s); getent hosts archive.ubuntu.com ports.ubuntu.com; echo "lookup status $? after $(( $(date +%s) - s )) s"
              s=$(date +%s)
              bash -e -o pipefail /loop.sh > /tmp/loop.log 2>&1; status=$?
              grep -E "^::|^(Err|E:|W:|Fetched|Setting up)" /tmp/loop.log | head -40
              echo "the loop: status $status after $(( $(date +%s) - s )) s"
              echo "== resolv.conf at the end"; grep -Ev "^(#|$)" /etc/resolv.conf
              hello'
          exit 0
