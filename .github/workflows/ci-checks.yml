# The quick checks of the workflows and of the CI scripts that need no build,
# on every pull request and push to main, on one Linux runner, so that a
# mistake in them shows before (or instead of) the hour of building:
#
#   - actionlint checks every workflow: syntax, expressions, job and step
#     references, the inputs of reusable workflows and actions (the shell
#     scripts in the steps are not checked: -shellcheck= turns that off);
#   - tools/ci/tests runs the unit tests of the CI scripts: the build
#     workflows' paths-ignore lists (a change to a file a build uses starts
#     that build), the checks release.yml makes on the packages before it
#     publishes them (tools/ci/release_assets.py, release_notes.py), and
#     the text dictionary's generator (tools/oxt/text_dictionary.py);
#   - tools/ci/changelog.py check: the changelog fragments of changelog
#     are CHANGELOG.md's "- " lines, ready to fold into it, and no pull
#     request's lines are lost from them;
#   - tools/ci/doc_branding.py check: the docs (Markdown and .lcdoc) say
#     xTalk Script, xTalk Builder and OXT-Beyond, and name LiveCode no more
#     often than doc-branding-baseline.txt allows (history, compatibility,
#     credits);
#   - tools/ci/runtimes_provenance.py: how many commits that change the
#     engine's source the runtimes asset (the other platforms' standalone
#     runtimes) is behind, as a warning in the job summary.
#
# The same unit tests on windows-latest and macos-15 (modernization report
# MOD-06) are in ci-checks-other-os.yml since 2026-11-16, which runs only
# when a script or a workflow changes: a macOS runner for 15 minutes on
# every commit of every pull request, docs and IDE scripts included, was
# the Mac queue's for a question only a changed script can raise.
#
# A change to this workflow or to the tests alone starts no build (the build
# workflows' paths-ignore lists have them).

name: CI checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Workflows and CI scripts
    runs-on: ubuntu-24.04
    # The unit tests alone took 584 s here in November 2026 (1716 tests),
    # and a limit of 10 minutes cancelled a run whose tests had all
    # passed: twice what they take, so a slower runner is not a failure
    timeout-minutes: 20
    steps:
      # (the whole history: the runtimes' provenance step looks back to
      # the commit the runtimes asset was built from, and the changelog
      # check compares with HEAD^1 or the commit a push replaced)
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pinned release, checked against its published SHA-256.
      # Downloaded with gh, through GitHub's API, and only when that fails
      # from the release's web address (github.com/.../releases/download).
      # On 9 November 2026 the web address answered "504 Gateway Time-out"
      # to the runners on and off for an hour, to all four of curl's tries
      # in three jobs (run 42568140708 and its re-run, run 42571371043),
      # while gh downloaded a 663 MB release in 10 s on the Android
      # builder's runners in between
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # (curl's --retry-all-errors: --retry alone does not try again
          # after a reset connection; tools/ci/tests/test_curl_retries.py)
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern "$archive" --dir "$RUNNER_TEMP" --clobber ||
            curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - name: Test the CI scripts
        run: |
          python3 --version
          # PyYAML reads the workflows (the runner image has it; installed
          # only where it does not)
          python3 -c 'import yaml' 2>/dev/null ||
            python3 -m pip install --user --break-system-packages pyyaml
          python3 -m unittest discover -s tools/ci/tests -v

      # --base: no pull request's lines are lost. HEAD^1 is the base of a
      # pull request's merge commit (what is checked out here); it needs
      # the history fetched above. On a push the commit the push replaced
      # is compared with instead (--pushed-over): a push may bring several
      # commits, and HEAD^1 is only the parent of the last.
      # #508's fragment took the name #502's had and wrote over its lines
      - name: Check the changelog fragments
        env:
          PUSHED_OVER: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python3 tools/ci/changelog.py check --base HEAD^1 --pushed-over "$PUSHED_OVER"

      # The LiveCode name stays out of the docs (0.2.8's debranding): a
      # new mention fails with its line, a removed one asks for the
      # baseline to be written again, so the count only goes down
      - name: Check the docs' branding
        run: python3 tools/ci/doc_branding.py check

      # GPLv3 5(a): every source file changed from LiveCode Community says
      # so (NOTICE-OF-MODIFICATIONS.md); needs the whole history above
      - name: Check the modification notices
        run: python3 tools/ci/modification_notices.py check

      # A warning in the summary, never a failure here: an engine change
      # must not turn every pull request red. The release is where it fails:
      # "Tag a release" runs this with --fail-on-stale (BUILDING.md section
      # 10, step 1), so every release carries runtimes of its own engine
      - name: Runtimes asset provenance
        run: python3 tools/ci/runtimes_provenance.py
