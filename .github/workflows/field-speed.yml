# How long a Sudoku-shaped stack's field work takes in the macOS packages of
# published releases (tools/ci/field_speed_test.py), on both Mac
# architectures, with the Mac light and dark, with the engine alone and in
# the IDE, profiled with `sample` and named from each release's symbols.
# A user's Sudoku stack froze the macOS IDE of 0.2.3: every statement that
# changed a field waited for the display. The build workflow checks its own
# package the same way (build-macos.yml, "Field speed check"); this one
# compares releases that are already out, by hand. A light-sdk run (such as
# light-sdk10.9) times a release as if its engine recorded another macOS SDK
# (tools/ci/macho_sdk.py): LiveCode's Mac build records 10.9, OXT-Beyond's
# 11.0, and AppKit draws windows differently from the 10.14 SDK on.

name: Field speed (macOS releases)

on:
  workflow_dispatch:
    inputs:
      tags:
        description: The releases to compare, separated by spaces
        type: string
        default: v0.2.3 v0.2.2
      runs:
        description: "The runs for each release, separated by spaces: light, dark, ide, light-sdk<version> (such as light-sdk10.9)"
        type: string
        default: light dark ide
      runner:
        description: The Macs to run on
        type: choice
        options: [both, macos-15, macos-15-intel]
        default: both

permissions:
  contents: read

concurrency:
  group: field-speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner == 'both' && '["macos-15", "macos-15-intel"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TAGS: ${{ inputs.tags }}
      RUNS: ${{ inputs.runs }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Machine: $(uname -m), macOS $(sw_vers -productVersion)"
          for tag in $TAGS; do
            dl="$RUNNER_TEMP/dl-$tag"
            mkdir -p "$dl" "$RUNNER_TEMP/$tag" "$RUNNER_TEMP/$tag-symbols"
            gh release download "$tag" --repo "$REPO" --pattern "*-mac-universal.zip" \
              --pattern "*-mac-universal-symbols.zip" --dir "$dl"
            ditto -x -k "$dl"/*-mac-universal.zip "$RUNNER_TEMP/$tag"
            ditto -x -k "$dl"/*-mac-universal-symbols.zip "$RUNNER_TEMP/$tag-symbols"
            rm -rf "$dl"
          done

      # Each release with the engine alone (its home stack) on the light
      # and the dark Mac, then in the IDE, or the runs asked for; a run that
      # fails does not stop the others
      - name: Time the releases
        run: |
          failed=0
          for tag in $TAGS; do
            app="$RUNNER_TEMP/$tag/OXT-Beyond.app"
            dwarf=$(find "$RUNNER_TEMP/$tag-symbols" -path '*LiveCode-Community.app.dSYM/Contents/Resources/DWARF/*' -type f | head -n 1)
            for run in $RUNS; do
              echo "::group::$tag, $run"
              run_app=$app
              case $run in
                light) args=(--mac light) ;;
                dark) args=(--mac dark --appearance system) ;;
                ide) args=(--mac light --ide --timeout 240) ;;
                light-sdk*)
                  # A copy whose engine records that SDK, signed again
                  run_app="$RUNNER_TEMP/$tag-$run/OXT-Beyond.app"
                  rm -rf "$RUNNER_TEMP/$tag-$run"
                  mkdir -p "$RUNNER_TEMP/$tag-$run"
                  if ! { ditto "$app" "$run_app" &&
                         python3 tools/ci/macho_sdk.py "$run_app/Contents/MacOS/OXT-Beyond" --set "${run#light-sdk}" &&
                         python3 tools/ci/sign_mac_app.py "$run_app"; }; then
                    echo "::error::$tag could not record SDK ${run#light-sdk}"
                    failed=1
                    echo "::endgroup::"
                    continue
                  fi
                  args=(--mac light) ;;
                *) echo "::error::no run called $run"; failed=1; echo "::endgroup::"; continue ;;
              esac
              python3 tools/ci/field_speed_test.py --app "$run_app" --out "$RUNNER_TEMP/runs/$tag-$run" \
                --dsym "$dwarf" "${args[@]}" || failed=1
              echo "::endgroup::"
            done
          done
          exit $failed

      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: field-speed-${{ matrix.runner }}
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
