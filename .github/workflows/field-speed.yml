# How long a Sudoku-shaped stack's field work takes in the macOS packages of
# published releases (tools/ci/field_speed_test.py), with the Mac light and
# dark, with the engine alone and in the IDE, profiled with `sample`. A
# user's Sudoku stack froze the macOS IDE of 0.2.3; this compares releases
# on both Mac architectures to find out where the time goes.

name: Field speed (macOS releases)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/field-speed.yml
      - tools/ci/field-speed-test.livecodescript
      - tools/ci/field_speed_test.py

permissions:
  contents: read

concurrency:
  group: field-speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Machine: $(uname -m), macOS $(sw_vers -productVersion)"
          for tag in v0.2.3 v0.2.2; do
            dl="$RUNNER_TEMP/dl-$tag"
            mkdir -p "$dl" "$RUNNER_TEMP/$tag" "$RUNNER_TEMP/$tag-symbols"
            gh release download "$tag" --repo "$REPO" --pattern "*-mac-universal.zip" \
              --pattern "*-mac-universal-symbols.zip" --dir "$dl"
            ditto -x -k "$dl"/*-mac-universal.zip "$RUNNER_TEMP/$tag"
            ditto -x -k "$dl"/*-mac-universal-symbols.zip "$RUNNER_TEMP/$tag-symbols"
            rm -rf "$dl"
            dwarf=$(find "$RUNNER_TEMP/$tag-symbols" -path '*LiveCode-Community.app.dSYM/Contents/Resources/DWARF/*' -type f | head -n 1)
            echo "$tag: dSYM $dwarf"
            dwarfdump --uuid "$dwarf" || true
            dwarfdump --uuid "$RUNNER_TEMP/$tag/OXT-Beyond.app/Contents/MacOS/OXT-Beyond" || true
            key=$(echo "$tag" | tr -d 'v.')
            echo "DWARF_$key=$dwarf" >> "$GITHUB_ENV"
          done

      # OpenXTalk Lite 1.15 for comparison, if its releases are on GitHub
      - name: Look for OpenXTalk Lite 1.15
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo openxtalk/OpenXTalk-lite --limit 20 || true
          for tag in $(gh release list --repo openxtalk/OpenXTalk-lite --limit 20 --json tagName --jq '.[].tagName' 2>/dev/null); do
            echo "== $tag"
            gh release view "$tag" --repo openxtalk/OpenXTalk-lite --json assets \
              --jq '.assets[] | .name + "  " + (.size|tostring)' || true
          done

      - name: 0.2.3, engine alone, the Mac light
        if: always()
        run: |
          python3 tools/ci/field_speed_test.py --app "$RUNNER_TEMP/v0.2.3/OXT-Beyond.app" \
            --out "$RUNNER_TEMP/runs/023-light" --mac light --dsym "$DWARF_023"

      - name: 0.2.2, engine alone, the Mac light
        if: always()
        run: |
          python3 tools/ci/field_speed_test.py --app "$RUNNER_TEMP/v0.2.2/OXT-Beyond.app" \
            --out "$RUNNER_TEMP/runs/022-light" --mac light --dsym "$DWARF_022"

      - name: 0.2.3, engine alone, the Mac dark, appAppearance system
        if: always()
        run: |
          python3 tools/ci/field_speed_test.py --app "$RUNNER_TEMP/v0.2.3/OXT-Beyond.app" \
            --out "$RUNNER_TEMP/runs/023-dark" --mac dark --appearance system --dsym "$DWARF_023"

      - name: 0.2.2, engine alone, the Mac dark, appAppearance system
        if: always()
        run: |
          python3 tools/ci/field_speed_test.py --app "$RUNNER_TEMP/v0.2.2/OXT-Beyond.app" \
            --out "$RUNNER_TEMP/runs/022-dark" --mac dark --appearance system --dsym "$DWARF_022"

      - name: 0.2.3 in the IDE, the Mac light
        if: always()
        run: |
          python3 tools/ci/field_speed_test.py --app "$RUNNER_TEMP/v0.2.3/OXT-Beyond.app" --ide \
            --out "$RUNNER_TEMP/runs/023-ide" --mac light --dsym "$DWARF_023" --timeout 240
          screencapture -x "$RUNNER_TEMP/runs/023-ide/screen.png" || true

      - name: 0.2.2 in the IDE, the Mac light
        if: always()
        run: |
          python3 tools/ci/field_speed_test.py --app "$RUNNER_TEMP/v0.2.2/OXT-Beyond.app" --ide \
            --out "$RUNNER_TEMP/runs/022-ide" --mac light --dsym "$DWARF_022" --timeout 240

      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: field-speed-${{ matrix.runner }}
          path: ${{ runner.temp }}/runs
          if-no-files-found: ignore
