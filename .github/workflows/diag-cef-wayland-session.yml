name: Diagnostic (CEF in a Wayland session)

# NOT FOR MAIN. Reproduces a forum report (the Dictionary ends the engine
# with a segmentation fault on Ubuntu 26.04) with the Linux package the
# report was made with: main at c77e5264, build 202611171337, Build (Linux)
# run 44094625366. This branch is deleted when the cause is recorded.
on:
  push:
    branches: ['claude/diag-cef-wayland-session']

permissions:
  contents: read
  actions: read

jobs:
  diag:
    name: The browser of build 202611171337 in a Wayland session
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the package of main at c77e5264
        uses: actions/download-artifact@v8
        with:
          name: OXT-Beyond-linux-x86_64
          path: ${{ runner.temp }}/dist
          run-id: 44094625366
          github-token: ${{ github.token }}

      - name: Install the runtime libraries, Weston, Xwayland and gdb
        timeout-minutes: 15
        run: |
          apt=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          "${apt[@]}" update
          pkgs=(xz-utils xvfb xauth weston xwayland gdb)
          while read -r soname use deb rpm rest; do
            case $soname in ''|'#'*) continue ;; esac
            if apt-cache show --no-all-versions "${deb}t64" > /dev/null 2>&1; then
              deb="${deb}t64"
            fi
            case " ${pkgs[*]} " in *" $deb "*) ;; *) pkgs+=("$deb") ;; esac
          done < Installer/linux/libraries.txt
          echo "Installing: ${pkgs[*]}"
          "${apt[@]}" install -y -q --no-install-recommends "${pkgs[@]}"
          weston --version || true

      - name: Extract the package
        run: |
          ls -la "$RUNNER_TEMP/dist"
          mkdir -p "$RUNNER_TEMP/oxt-test"
          tar -xJf "$RUNNER_TEMP"/dist/OXT-Beyond-*-linux-x86_64.tar.xz -C "$RUNNER_TEMP/oxt-test"
          root=$(echo "$RUNNER_TEMP"/oxt-test/*)
          ls "$root" | head -40
          cat "$root/.version" || true
          echo "OXT_ROOT=$root" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p" || true

      - name: Tools for the window tree and Mutter
        if: ${{ !cancelled() && env.OXT_ROOT != '' }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends x11-utils mutter dbus dbus-x11 > /dev/null
          mutter --version

      - name: h1. Under Xvfb (the control), with the X window tree
        if: ${{ !cancelled() && env.OXT_ROOT != '' }}
        run: |
          Xvfb :77 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 2
          env -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE DISPLAY=:77 bash .github/diag/check-in-session.sh h1-xvfb \
            "$OXT_ROOT" "$RUNNER_TEMP/logs" "$RUNNER_TEMP/cores"
          kill %1 || true

      - name: h2. In a Weston session, with the X window tree
        if: ${{ !cancelled() && env.OXT_ROOT != '' }}
        run: |
          # (media_check's own session: Xwayland takes the first free display, :0 here)
          env -u WAYLAND_DISPLAY DISPLAY=:0 bash .github/diag/check-in-session.sh h2-weston \
            "$OXT_ROOT" "$RUNNER_TEMP/logs" "$RUNNER_TEMP/cores" --session wayland

      - name: h3. In a Mutter session (GNOME's compositor, headless)
        if: ${{ !cancelled() && env.OXT_ROOT != '' }}
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY dbus-run-session -- bash .github/diag/mutter-session.sh \
            bash .github/diag/check-in-session.sh h3-mutter "$OXT_ROOT" "$RUNNER_TEMP/logs" "$RUNNER_TEMP/cores"

      - name: c. In an Ubuntu 26.04 container
        if: ${{ !cancelled() && env.OXT_ROOT != '' }}
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/logs26" /tmp/cores26
          sudo sysctl -w kernel.core_pattern="/cores/core.%e.%p" || true
          docker run --rm --shm-size=2g --ulimit core=-1 \
            -v "$GITHUB_WORKSPACE:/w:ro" -v "$OXT_ROOT:/oxt:ro" -v "$RUNNER_TEMP/logs26:/logs" -v /tmp/cores26:/cores \
            ubuntu:26.04 bash /w/.github/diag/in-container.sh
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p" || true

      - name: The results
        if: ${{ !cancelled() }}
        run: |
          for f in "$RUNNER_TEMP"/logs/*.log "$RUNNER_TEMP"/logs26/*.log; do echo "===== $f"; cut -c1-300 "$f"; done
