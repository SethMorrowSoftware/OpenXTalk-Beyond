# OXT-Beyond web bundle: what both of nginx.conf's server blocks share.
# Copy it to /etc/nginx/oxt-beyond-web-common.conf.

index index.html;
gzip_static on;
gzip_vary on;
# brotli_static on;
etag on;

add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;

location / {
    try_files $uri $uri/ =404;
}

# The engine is WebAssembly: a browser runs it only with this type (older
# nginx mime.types lack it). "types" here replaces the map for this
# location only, and the add_header lines above are repeated because a
# location with its own add_header drops the server's.
location ~* \.wasm$ {
    types { }
    default_type application/wasm;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
