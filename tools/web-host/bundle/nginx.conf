# OXT-Beyond web bundle: nginx. Made by tools/web-host/make_bundle.py.
#
# Two server blocks, one for the web IDE and one for the Stack Player, on
# two host names: they must not share an origin (README.txt says why).
# Change the names and the folders, put the file in /etc/nginx/conf.d/
# (or sites-enabled/), then "nginx -t && systemctl reload nginx". Add HTTPS
# with certbot ("certbot --nginx") before the site faces the internet.
#
# The .gz files beside the big files are made for gzip_static, which
# Debian's and Ubuntu's nginx have. The .br files need the brotli module
# (ngx_brotli); uncomment brotli_static if your nginx has it.

server {
    listen 80;
    server_name ide.example.org;
    root /var/www/oxt-beyond/ide;
    include /etc/nginx/oxt-beyond-web-common.conf;
}

server {
    listen 80;
    server_name play.example.org;
    root /var/www/oxt-beyond/player;
    include /etc/nginx/oxt-beyond-web-common.conf;
}
